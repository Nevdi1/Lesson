				}
			};

			const timetableLinks = {
				'TP': 'https://zsppuck.edupage.org/timetable/view.php?num=103&class=-334',
				'TI': 'https://zsppuck.edupage.org/timetable/view.php?num=103&class=-330',
				'BK': 'https://zsppuck.edupage.org/timetable/view.php?num=103&class=-309'
			};

			let currentPlan = 'TP';
			let currentDay = getCurrentDayId();

			function getCurrentDayId() {
				const days = ['pi', 'pn', 'wt', 'sr', 'cz', 'pi', 'pi'];
				const dayIndex = new Date().getDay();
				return days[dayIndex];
			}

			function render() {
				const container = document.getElementById('schedule-data');
				container.innerHTML = '';
				const lessons = plans[currentPlan][currentDay] || [];
				const now = new Date();
				const currentMinutes = now.getHours() * 60 + now.getMinutes();

				lessons.forEach(l => {
					const div = document.createElement('div');
					const [hours, minutes] = l.t.split(':').map(Number);
					const startTotalMinutes = hours * 60 + minutes;
					const endTotalMinutes = startTotalMinutes + 45;

					const endHours = Math.floor(endTotalMinutes / 60);
					const endMins = endTotalMinutes % 60;
					const endTimeStr = `${endHours}:${endMins < 10 ? '0' + endMins : endMins}`;

					const isActive = currentMinutes >= startTotalMinutes && currentMinutes < endTotalMinutes;
					const isBreak = currentMinutes < startTotalMinutes && currentMinutes >= (startTotalMinutes - 10);

					div.className = `lesson ${l.c} ${isActive ? 'active-now' : ''}`;
					div.setAttribute('data-num', l.n);
					div.setAttribute('data-time', `${l.t} — ${endTimeStr}`);

					let html = `<span>${l.m}</span>`;
					if (isActive) {
						const timeLeft = endTotalMinutes - currentMinutes;
						html += `<div class="timer">До конца: ${timeLeft} мин</div>`;
					} else if (isBreak) {
						const timeUntil = startTotalMinutes - currentMinutes;
						html += `<div class="timer break">До начала: ${timeUntil} мин</div>`;
					}

					div.innerHTML = html;
					div.onclick = () => toggleRoom(l.r);
					container.appendChild(div);
				});
			}

			function switchPlan(id) {
				currentPlan = id;
				localStorage.setItem('currentPlan', id);
				document.getElementById('page-title').innerText = id;
				document.getElementById('timetable-link').href = timetableLinks[id];
				document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
				document.getElementById('link-' + id).classList.add('active');
				render();
			}

			function showDay(day) {
				currentDay = day;
				const dayMap = { pn: 'pn', wt: 'wt', sr: 'śr', cz: 'cz', pi: 'pi' };
				document.querySelectorAll('.day-btn').forEach(b => {
					b.classList.toggle('active', b.innerText.toLowerCase() === dayMap[day]);
				});
				render();
			}

			function toggleRoom(room) {
				const popup = document.getElementById('room-info');
				const span = popup.querySelector('span');
				if (popup.classList.contains('show') && span.innerText === room) {
					popup.classList.remove('show');
				} else {
					span.innerText = room;
					popup.classList.add('show');
				}
			}

			window.onload = () => {
				const savedPlan = localStorage.getItem('currentPlan');
				currentPlan = (savedPlan && plans[savedPlan]) ? savedPlan : 'TP';
				document.getElementById('timetable-link').href = timetableLinks[currentPlan];
				document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
				document.getElementById('link-' + currentPlan).classList.add('active');
				document.getElementById('page-title').innerText = currentPlan;
				showDay(currentDay);
				setInterval(render, 30000);
			};
		</script>
